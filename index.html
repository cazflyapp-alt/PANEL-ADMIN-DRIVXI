<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Bikar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-[#0E0E0E] min-h-screen flex flex-col">

    <!-- Barra Superior Profesional -->
    <header class="bg-[#0E0E0E] text-white shadow-lg border-b-4 border-[#80B13D] px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <img src="https://i.imgur.com/gcYd3zg.png" alt="Logo Bikar" class="h-10 w-auto object-contain rounded">
            <div class="border-l border-gray-700 pl-4">
                <h1 class="text-lg font-bold tracking-wider uppercase text-white">Centro de Control</h1>
                <p class="text-xs text-gray-400">Administración General</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <span id="connection-status" class="text-xs font-semibold bg-[#80B13D]/20 text-[#80B13D] px-3.5 py-1.5 rounded-full border border-[#80B13D]/40 flex items-center">
                <span class="inline-block w-2 h-2 rounded-full bg-[#80B13D] mr-1.5 animate-pulse"></span> Conectado a Supabase
            </span>
        </div>
    </header>

    <!-- Contenedor con Sidebar y Contenido Principal -->
    <div class="flex-grow flex flex-col md:flex-row">
        <!-- Sidebar de Navegación -->
        <aside class="w-full md:w-64 bg-[#0E0E0E] text-white p-4 space-y-2 border-r border-gray-800">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">Módulos</p>
            <button onclick="cargarTabla('usuarios')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors bg-[#80B13D] text-[#0E0E0E]" id="btn-usuarios">
                👤 Usuarios
            </button>
            <button onclick="cargarTabla('conductores')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-conductores">
                🚗 Conductores
            </button>
            <button onclick="cargarTabla('viajes')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-viajes">
                📍 Viajes
            </button>
            <button onclick="cargarTabla('comercios')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-comercios">
                🏪 Comercios
            </button>
        </aside>

        <!-- Área de Contenido Principal -->
        <main class="flex-grow p-6 max-w-full overflow-x-auto">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <div>
                        <h2 id="table-title" class="text-lg font-bold text-[#0E0E0E] capitalize">Usuarios</h2>
                        <p id="table-subtitle" class="text-xs text-gray-500">Mostrando registros recientes de la base de datos.</p>
                    </div>
                    <button onclick="cargarTabla(tablaActual)" class="text-xs bg-[#0E0E0E] text-white px-3 py-1.5 rounded-lg hover:bg-gray-800 transition">
                        🔄 Recargar
                    </button>
                </div>
                
                <!-- Tabla Dinámica -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="data-table">
                        <thead>
                            <tr id="table-head" class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-200">
                                <!-- Las columnas se cargan dinámicamente -->
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
                            <!-- Los datos se cargan dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://kjfhplnwmigxxsfcirtj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZmhwbG53bWlneHhzZmNpcnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMDAxNjEsImV4cCI6MjEwOTc3NjE2MX0.AizcNq5k4hYknGmBmS7q2X9nlcb_OleY5Xp8a7Omlt4';

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let tablaActual = 'usuarios';

        async function cargarTabla(nombreTabla) {
            tablaActual = nombreTabla;
            
            // Actualizar estilos activos en el menú
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = 'nav-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white';
            });
            const activeBtn = document.getElementById(`btn-${nombreTabla}`);
            if (activeBtn) {
                activeBtn.className = 'nav-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors bg-[#80B13D] text-[#0E0E0E] font-semibold';
            }

            document.getElementById('table-title').textContent = nombreTabla;
            document.getElementById('table-subtitle').textContent = `Registros extraídos de la tabla pública '${nombreTabla}'.`;

            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            
            thead.innerHTML = '<th class="px-6 py-3">Cargando datos...</th>';
            tbody.innerHTML = '<tr><td class="px-6 py-4 text-gray-500">Consultando Supabase...</td></tr>';

            try {
                const { data, error } = await _supabase.from(nombreTabla).select('*').limit(50);
                if (error) throw error;

                if (!data || data.length === 0) {
                    thead.innerHTML = '<tr><th class="px-6 py-3">Información</th></tr>';
                    tbody.innerHTML = '<tr><td class="px-6 py-4 text-gray-500">No hay registros en esta tabla actualmente.</td></tr>';
                    return;
                }

                // Generar cabeceras basadas en las llaves del primer objeto
                const columnas = Object.keys(data[0]);
                thead.innerHTML = columnas.map(col => `<th class="px-6 py-3 font-semibold">${col}</th>`).join('');

                // Generar filas de datos
                tbody.innerHTML = data.map(fila => {
                    return `<tr class="hover:bg-gray-50 transition">` + 
                        columnas.map(col => {
                            let valor = fila[col];
                            if (valor === null) valor = '<span class="text-gray-300 italic">null</span>';
                            else if (typeof valor === 'boolean') valor = valor ? '<span class="text-green-600 font-medium">Sí</span>' : '<span class="text-red-500 font-medium">No</span>';
                            else if (typeof valor === 'object') valor = JSON.stringify(valor).substring(0, 30) + '...';
                            return `<td class="px-6 py-4 whitespace-nowrap">${valor}</td>`;
                        }).join('') + 
                    `</tr>`;
                }).join('');

            } catch (err) {
                console.error('Error al cargar la tabla:', err);
                thead.innerHTML = '<tr><th class="px-6 py-3 text-red-600">Error</th></tr>';
                tbody.innerHTML = `<tr><td class="px-6 py-4 text-red-500">No se pudieron cargar los datos: ${err.message}</td></tr>`;
            }
        }

        // Cargar usuarios por defecto al abrir
        cargarTabla('usuarios');
    </script>
</body>
</html>
