<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Bikar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #80B13D; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-[#0E0E0E] min-h-screen flex flex-col">

    <!-- Barra Superior Profesional -->
    <header class="bg-[#0E0E0E] text-white shadow-lg border-b-4 border-[#80B13D] px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center space-x-4">
            <img src="https://i.imgur.com/gcYd3zg.png" alt="Logo Bikar" class="h-10 w-auto object-contain rounded">
            <div class="border-l border-gray-700 pl-4">
                <h1 class="text-lg font-bold tracking-wider uppercase text-white">Centro de Control</h1>
                <p class="text-xs text-gray-400">Administración General - Drivxi</p>
            </div>
        </div>
    </header>

    <!-- Contenedor con Sidebar y Contenido Principal -->
    <div class="flex-grow flex flex-col md:flex-row">
        <!-- Sidebar de Navegación -->
        <aside class="w-full md:w-64 bg-[#0E0E0E] text-white p-4 space-y-1.5 border-r border-gray-800 shrink-0">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2 mt-1">Operación Principal</p>
            <button onclick="cargarTabla('usuarios')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-[#80B13D] text-[#0E0E0E]" id="btn-usuarios">
                👤 Usuarios
            </button>
            <button onclick="cargarTabla('conductores')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-conductores">
                🚗 Conductores
            </button>
            <button onclick="cargarTabla('pasajeros')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-pasajeros">
                🧍 Pasajeros
            </button>
            <button onclick="cargarTabla('viajes')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-viajes">
                📍 Viajes
            </button>
            <button onclick="cargarTabla('comercios')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-comercios">
                🏪 Comercios
            </button>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2 pt-4">Flota y Soporte</p>
            <button onclick="cargarTabla('documentos_conductor')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-documentos_conductor">
                📄 Documentos Conductor
            </button>
            <button onclick="cargarTabla('vehiculos')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-vehiculos">
                🚙 Vehículos
            </button>
            <button onclick="cargarTabla('calificaciones')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-calificaciones">
                ⭐ Calificaciones
            </button>
            <button onclick="cargarTabla('mensajes_viaje')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-mensajes_viaje">
                💬 Mensajes Viaje
            </button>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2 pt-4">Sistema</p>
            <button onclick="cargarTabla('politicas_aceptaciones')" class="nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white" id="btn-politicas_aceptaciones">
                🛡️ Políticas Aceptadas
            </button>
        </aside>

        <!-- Área de Contenido Principal -->
        <main class="flex-grow p-6 max-w-full overflow-x-auto space-y-6">
            
            <!-- Tarjetas de Resumen (KPIs) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-[#80B13D]">
                    <p class="text-xs font-semibold text-gray-500 uppercase">Total Usuarios</p>
                    <p id="kpi-usuarios" class="text-2xl font-bold text-[#0E0E0E] mt-1">...</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-[#0E0E0E]">
                    <p class="text-xs font-semibold text-gray-500 uppercase">Conductores</p>
                    <p id="kpi-conductores" class="text-2xl font-bold text-[#0E0E0E] mt-1">...</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-[#80B13D]">
                    <p class="text-xs font-semibold text-gray-500 uppercase">Viajes Registrados</p>
                    <p id="kpi-viajes" class="text-2xl font-bold text-[#0E0E0E] mt-1">...</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-[#0E0E0E]">
                    <p class="text-xs font-semibold text-gray-500 uppercase">Comercios</p>
                    <p id="kpi-comercios" class="text-2xl font-bold text-[#0E0E0E] mt-1">...</p>
                </div>
            </div>

            <!-- Contenedor de la Tabla -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-5 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-50">
                    <div>
                        <h2 id="table-title" class="text-lg font-bold text-[#0E0E0E] capitalize">Usuarios</h2>
                        <p id="table-subtitle" class="text-xs text-gray-500">Haz clic en cualquier fila para ver el detalle completo.</p>
                    </div>
                    
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <input type="text" id="search-input" onkeyup="filtrarTabla()" placeholder="Buscar en esta tabla..." 
                            class="text-sm border border-gray-300 rounded-lg px-3 py-1.5 w-full sm:w-64 focus:outline-none focus:border-[#80B13D]">
                        
                        <button onclick="cargarTabla(tablaActual); cargarKPIs();" class="text-xs bg-[#0E0E0E] text-white px-3.5 py-2 rounded-lg hover:bg-gray-800 transition shrink-0 font-medium">
                            🔄 Actualizar
                        </button>
                    </div>
                </div>
                
                <!-- Tabla Dinámica -->
                <div class="overflow-x-auto max-h-[600px]">
                    <table class="w-full text-left border-collapse cursor-pointer" id="data-table">
                        <thead class="sticky top-0 z-10">
                            <tr id="table-head" class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-200">
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Detalle de Fila -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden border-t-4 border-[#80B13D]">
            <div class="p-5 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-bold text-[#0E0E0E]" id="modal-title">Detalle del Registro</h3>
                    <p class="text-xs text-gray-500">Información completa ampliada</p>
                </div>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-2 py-1 rounded-lg">✕</button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto space-y-4 text-sm text-gray-700">
                <!-- Contenido generado dinámicamente -->
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-200 text-right">
                <button onclick="cerrarModal()" class="bg-[#0E0E0E] text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-gray-800 transition">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kjfhplnwmigxxsfcirtj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZmhwbG53bWlneHhzZmNpcnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMDAxNjEsImV4cCI6MjEwOTc3NjE2MX0.AizcNq5k4hYknGmBmS7q2X9nlcb_OleY5Xp8a7Omlt4';

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let tablaActual = 'usuarios';
        let datosActuales = [];

        async function cargarKPIs() {
            const tablasKPI = ['usuarios', 'conductores', 'viajes', 'comercios'];
            for (const tabla of tablasKPI) {
                try {
                    const { count, error } = await _supabase.from(tabla).select('*', { count: 'exact', head: true });
                    if (!error) document.getElementById(`kpi-${tabla}`).textContent = count ?? 0;
                } catch (e) { console.error(e); }
            }
        }

        async function cargarTabla(nombreTabla) {
            tablaActual = nombreTabla;
            document.getElementById('search-input').value = '';
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = 'nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors text-gray-300 hover:bg-gray-800 hover:text-white';
            });
            const activeBtn = document.getElementById(`btn-${nombreTabla}`);
            if (activeBtn) {
                activeBtn.className = 'nav-btn w-full text-left px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-[#80B13D] text-[#0E0E0E] font-semibold';
            }

            document.getElementById('table-title').textContent = nombreTabla.replace(/_/g, ' ');
            document.getElementById('table-subtitle').textContent = `Consultando registros de '${nombreTabla}'...`;

            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            
            thead.innerHTML = '<th class="px-6 py-3">Cargando...</th>';
            tbody.innerHTML = '<tr><td class="px-6 py-4 text-gray-500">Obteniendo información desde Supabase...</td></tr>';

            try {
                let data = [];
                
                // Caso especial para Viajes: enriquecer con nombres y placas, y filtrar columnas de reseñas/calificaciones
                if (nombreTabla === 'viajes') {
                    const { data: viajesData, error: errViajes } = await _supabase.from('viajes').select('*').order('id', { ascending: false }).limit(100);
                    if (errViajes) throw errViajes;

                    // Consultar tablas relacionadas para mapear nombres y placas
                    const [resPasajeros, resConductores, resUsuarios, resDocs] = await Promise.all([
                        _supabase.from('pasajeros').select('id, usuario_id'),
                        _supabase.from('conductores').select('id, usuario_id'),
                        _supabase.from('usuarios').select('id, nombre'),
                        _supabase.from('documentos_conductor').select('conductor_id, placa')
                    ]);

                    const mapUsuarios = new Map((resUsuarios.data || []).map(u => [u.id, u.nombre]));
                    const mapPasajerosUser = new Map((resPasajeros.data || []).map(p => [p.id, p.usuario_id]));
                    const mapConductoresUser = new Map((resConductores.data || []).map(c => [c.id, c.usuario_id]));
                    const mapPlacas = new Map((resDocs.data || []).map(d => [d.conductor_id, d.placa]));

                    data = (viajesData || []).map(v => {
                        let pasajeroNombre = 'N/D';
                        let conductorNombre = 'N/D';
                        let placaVehiculo = 'N/D';

                        if (v.pasajero_id && mapPasajerosUser.has(v.pasajero_id)) {
                            pasajeroNombre = mapUsuarios.get(mapPasajerosUser.get(v.pasajero_id)) || 'N/D';
                        }
                        if (v.conductor_id) {
                            if (mapConductoresUser.has(v.conductor_id)) {
                                conductorNombre = mapUsuarios.get(mapConductoresUser.get(v.conductor_id)) || 'N/D';
                            }
                            placaVehiculo = mapPlacas.get(v.conductor_id) || 'N/D';
                        }

                        // Limpiar columnas de reseñas y calificaciones del conductor en viajes
                        let clon = { ...v };
                        delete clon.calificacion_conductor;
                        delete clon.resena_pasajero;
                        delete clon.resena_conductor;

                        clon.pasajero = pasajeroNombre;
                        clon.conductor = conductorNombre;
                        clon.placa = placaVehiculo;
                        return clon;
                    });
                } else {
                    const { data: resData, error } = await _supabase.from(nombreTabla).select('*').order('id', { ascending: false }).limit(100);
                    if (error) throw error;
                    data = resData || [];
                }

                datosActuales = data;
                document.getElementById('table-subtitle').textContent = `Mostrando ${datosActuales.length} registros. Haz clic en una fila para ver el detalle.`;
                renderizarFilas(datosActuales);

            } catch (err) {
                console.error(err);
                thead.innerHTML = '<tr><th class="px-6 py-3 text-red-600">Aviso</th></tr>';
                tbody.innerHTML = `<tr><td class="px-6 py-4 text-red-500">No se pudieron leer los datos: ${err.message}</td></tr>`;
            }
        }

        function renderizarFilas(listaDatos) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');

            if (!listaDatos || listaDatos.length === 0) {
                thead.innerHTML = '<tr><th class="px-6 py-3">Sin resultados</th></tr>';
                tbody.innerHTML = '<tr><td class="px-6 py-4 text-gray-500">No hay registros para mostrar.</td></tr>';
                return;
            }

            const columnas = Object.keys(listaDatos[0]);
            thead.innerHTML = columnas.map(col => `<th class="px-6 py-3 font-semibold">${col}</th>`).join('');

            tbody.innerHTML = listaDatos.map((fila, index) => {
                return `<tr onclick="abrirDetalle(${index})" class="hover:bg-gray-50 transition">` + 
                    columnas.map(col => {
                        let valor = fila[col];
                        if (valor === null) valor = '<span class="text-gray-300 italic">null</span>';
                        else if (typeof valor === 'boolean') {
                            valor = valor 
                                ? '<span class="px-2 py-0.5 text-xs rounded-full bg-green-100 text-green-700 font-semibold">Sí</span>' 
                                : '<span class="px-2 py-0.5 text-xs rounded-full bg-red-100 text-red-700 font-semibold">No</span>';
                        } else if (typeof valor === 'string' && (valor.startsWith('http://') || valor.startsWith('https://'))) {
                            valor = `<a href="${valor}" target="_blank" onclick="event.stopPropagation()" class="text-[#80B13D] hover:underline font-medium">🔗 Ver enlace</a>`;
                        } else if (typeof valor === 'object') {
                            valor = `<span class="text-xs font-mono bg-gray-100 px-1.5 py-0.5 rounded">${JSON.stringify(valor).substring(0, 30)}...</span>`;
                        }
                        return `<td class="px-6 py-3.5 whitespace-nowrap">${valor}</td>`;
                    }).join('') + 
                `</tr>`;
            }).join('');
        }

        function abrirDetalle(index) {
            const fila = datosActuales[index];
            if (!fila) return;

            document.getElementById('modal-title').textContent = `Detalle de ${tablaActual.replace(/_/g, ' ')} (ID: ${fila.id || 'N/D'})`;
            const contenido = document.getElementById('modal-content');
            
            let html = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">';
            for (const [key, value] of Object.entries(fila)) {
                let valFormateado = value;
                if (valFormateado === null) {
                    valFormateado = '<span class="text-gray-400 italic">null</span>';
                } else if (typeof valFormateado === 'string' && (valFormateado.startsWith('http://') || valFormateado.startsWith('https://'))) {
                    valFormateado = `<a href="${valFormateado}" target="_blank" class="text-[#80B13D] font-semibold underline block mt-1">🔗 Abrir documento / imagen</a><img src="${valFormateado}" class="mt-2 h-24 rounded object-contain border border-gray-200" onerror="this.style.display='none'">`;
                } else if (typeof valFormateado === 'object') {
                    valFormateado = `<pre class="bg-gray-100 p-2 rounded text-xs font-mono overflow-x-auto">${JSON.stringify(valFormateado, null, 2)}</pre>`;
                }
                
                html += `
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <span class="text-xs font-bold text-gray-500 uppercase block">${key}</span>
                        <div class="text-sm font-medium text-[#0E0E0E] mt-1 break-words">${valFormateado}</div>
                    </div>
                `;
            }
            html += '</div>';
            contenido.innerHTML = html;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function filtrarTabla() {
            const texto = document.getElementById('search-input').value.toLowerCase();
            if (!texto) {
                renderizarFilas(datosActuales);
                return;
            }
            const filtrados = datosActuales.filter(fila => 
                Object.values(fila).some(val => 
                    val !== null && String(val).toLowerCase().includes(texto)
                )
            );
            renderizarFilas(filtrados);
        }

        cargarKPIs();
        cargarTabla('usuarios');
    </script>
</body>
</html>
