<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Bikar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fuente Inter para acabado moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-[#0E0E0E] min-h-screen flex flex-col">

    <!-- Barra Superior Profesional -->
    <header class="bg-[#0E0E0E] text-white shadow-lg border-b-4 border-[#80B13D] px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <img src="https://i.imgur.com/gcYd3zg.png" alt="Logo Bikar" class="h-10 w-auto object-contain rounded">
            <div class="border-l border-gray-700 pl-4">
                <h1 class="text-lg font-bold tracking-wider uppercase text-white">Centro de Control</h1>
                <p class="text-xs text-gray-400">Administración General</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <span id="connection-status" class="text-xs font-medium bg-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full border border-gray-700">
                Conectando...
            </span>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-grow p-6 max-w-7xl w-full mx-auto">
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 flex items-center justify-between">
            <div>
                <span class="inline-block w-3 h-3 rounded-full bg-[#80B13D] mr-2"></span>
                <span class="text-sm font-semibold text-[#0E0E0E] uppercase tracking-wide">Módulo Base Inicializado</span>
                <p class="text-sm text-gray-500 mt-1">Conexión directa establecida en modo solo lectura con tu base de datos.</p>
            </div>
            <div class="text-right">
                <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2.5 py-1 rounded">v1.0 • Modo Seguro</span>
            </div>
        </div>
    </main>

    <script>
        // Credenciales configuradas (URL base limpia para supabase-js)
        const SUPABASE_URL = 'https://kjfhplnwmigxxsfcirtj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZmhwbG53bWlneHhzZmNpcnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMDAxNjEsImV4cCI6MjEwOTc3NjE2MX0.AizcNq5k4hYknGmBmS7q2X9nlcb_OleY5Xp8a7Omlt4';

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verificación de conexión en modo solo lectura
        async function probarConexion() {
            const statusBadge = document.getElementById('connection-status');
            try {
                const { data, error } = await _supabase.from('usuarios').select('id').limit(1);
                if (error) throw error;
                
                statusBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-[#80B13D] mr-1.5 animate-pulse"></span> Conectado a Supabase';
                statusBadge.className = 'text-xs font-semibold bg-[#80B13D]/20 text-[#80B13D] px-3.5 py-1.5 rounded-full border border-[#80B13D]/40 flex items-center';
            } catch (err) {
                console.error('Error de conexión:', err);
                statusBadge.textContent = 'Error de conexión 🔴';
                statusBadge.className = 'text-xs font-semibold bg-red-900/40 text-red-400 px-3.5 py-1.5 rounded-full border border-red-700';
            }
        }

        probarConexion();
    </script>
</body>
</html>
